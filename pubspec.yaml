name: calicore
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+32

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  stylish_bottom_bar: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_store.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo_store.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
